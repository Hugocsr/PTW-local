# APENAS laboratório: credenciais fictícias públicas, LDAP sem porta publicada.
# docker compose -f compose.yaml -f compose.ldap-test.yaml up -d --build
services:
  web:
    ports: !override ["127.0.0.1:${PTW_HTTPS_PORT:-443}:8443", "127.0.0.1:${PTW_HTTP_PORT:-80}:8080"]
  ldap-gateway:
    build: ./ldap/gateway
    image: ptw-ldap-gateway:local
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: { PTW_LDAP_HOST: ldap-test, PTW_LDAP_PORT: "1636" }
    networks: [interna]
    depends_on:
      ldap-test: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 48M, pids: 40 }
  ldap-test:
    build: ./ldap/test
    image: ptw-ldap-test:local
    user: "1000:1000"
    ulimits:
      nofile: { soft: 1024, hard: 1024 }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: ["ldap-test-certs:/certs"]
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=0700"]
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_CACERT=/certs/ca.crt ldapwhoami -H ldaps://ldap-test:1636 -x -D cn=reader,dc=ptw,dc=test -w Somente-teste-local >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64M, pids: 50 }
  api:
    environment:
      PTW_LDAP_CONFIG_FILE: /ldap-fixture/config.json
      PTW_DEV_LOGIN: "0"
    volumes:
      - ./ldap/test:/ldap-fixture:ro
      - ldap-test-certs:/ldap-certs:ro
    depends_on:
      ldap-test: { condition: service_healthy }
      ldap-gateway: { condition: service_started }
  api-test:
    image: ptw-api-test:local
    profiles: [test]
    environment:
      PTW_TEST_LDAP: "1"
      PTW_LOGIN_LIMIT: "1"   # os testes continuam exercitando o bloqueio; o serviço normal o deixa desligado
      PTW_LDAP_CONFIG_FILE: /ldap-fixture/config.json
    volumes:
      - ./ldap/test:/ldap-fixture:ro
      - ldap-test-certs:/ldap-certs:ro
    depends_on:
      ldap-test: { condition: service_healthy }
      ldap-gateway: { condition: service_started }
volumes:
  ldap-test-certs:
