# Repassador da API do Docker para o "stats": só os quatro GETs que o coletor usa; todo o resto, 403.
# Substitui o modelo da imagem (tecnativa/docker-socket-proxy), que libera /containers/* inteiro
# (inclusive /archive, /export e /logs, que leem arquivos e saída de qualquer contêiner).
global
    log stdout format raw daemon warning
    pidfile /run/haproxy.pid
    maxconn 64
    nbthread 2

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 1m
    timeout server 1m
    maxconn 32
    errorfile 403 /usr/local/etc/haproxy/errors/403.http

backend docker
    server socket /var/run/docker.sock

frontend api
    bind ${BIND_CONFIG}
    http-request deny unless METH_GET
    # Lista de contêineres, inspeção e uma leitura de stats de um contêiner; tamanhos de imagens e volumes.
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/(json|stats)$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/system/df$ }
    http-request deny
    default_backend docker
