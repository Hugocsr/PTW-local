openapi: 3.1.0
info:
  title: PTW in a Box · API
  version: 1.0.0-fase1
  summary: "Contrato da API entre o app (ptw-mockup-v2) e o banco (ptw-server/db/schema)."
  description: |
    Contrato da fase 1 da fábrica (`fabrica/fase-1.md`). Fonte única entre os pacotes: quem implementa a
    API e quem implementa a camada de dados do app seguem este arquivo.

    **Formas.** Nomes e formatos são os do banco (`db/MODELO.md`) em camelCase, exatamente como os tipos do
    app já fazem (`src/registry/types.ts`, `src/registry/modelTypes.ts`, `src/permit/types.ts`,
    `src/core/form.ts`, `src/core/audit.ts`). Instantes: ISO 8601 com fuso. Dia: `AAAA-MM-DD`. Hash: hexa
    minúsculo. Ids: uuid (v7); o cliente pode gerar o id de um registro novo (campo `id` no corpo).

    **Quem age.** A pessoa é sempre a da sessão (`ptw.current_person()`); nenhum corpo leva `personId` de
    quem age. A unidade é a da sessão (RLS).

    **Transação.** Cada requisição autenticada abre uma transação e chama
    `ptw.set_context(unidade, pessoa, cargo, autenticação, aparelho, id_da_requisição, motivo, p_undo)`:
    `X-Request-Id` → `p_request`, `X-Ptw-Client` → `p_client`, `X-Ptw-Undo: true` → `p_undo`; o motivo
    (`p_reason`) vem do corpo ou de `X-Ptw-Reason` nas operações que o pedem. `X-Request-Id` e
    `X-Ptw-Client` são aceitos em toda operação (declarados em `GET /session`).

    **Concorrência otimista.** Onde o banco tem revisão, a escrita exige `If-Match: "<n>"`: `revision` nos
    cadastros, modelos e versões em rascunho; `rowVersion` na PT. Valor antigo → `409 PTA06` (em `detail`,
    a revisão atual). Sem o cabeçalho → `428 PTA07`. A resposta traz `ETag: "<n>"`. Parar não exige
    `If-Match` (Parar nunca perde uma corrida).

    **Idempotência.** `POST` que cria aceita `Idempotency-Key` (uuid). A mesma chave com o mesmo corpo
    devolve a resposta original (`Idempotency-Replayed: true`); com outro corpo, `422 PTA08`.

    **Erros.** Um formato só: `{ code, message, detail? }`. `code` é o do banco (`PTWnn` ou SQLSTATE de
    5 caracteres) ou da própria API (`PTAnn`). A mensagem é a do banco; o título da tela vem de
    `core/ptwErrors.ts` (`PTW_MESSAGE`). Mapa em `x-ptw-error-map`. Toda recusa por regra (4xx com
    `PTWnn`, `23xxx`, `42501`, `PTA02`, `PTA03`) fica na trilha por `ptw.audit_denied`, em outra transação.

    **Paginação.** Listas de cadastro e o Quadro: `page` (a partir de 0) + `pageSize`, resposta com
    `total`. Auditoria e Histórico: cursor por `seq` (`before`), do mais novo para o mais antigo.

    **Extensões.** `x-ptw-codes`: recusas de regra esperadas na operação (cada uma tem teste de contrato).
    `x-ptw-audit`: o que a operação grava na trilha além dos gatilhos do banco.
  license:
    name: Uso interno
    identifier: LicenseRef-Proprietary

servers:
  - url: /api/v1
    description: "Atrás do Caddy (`web`), mesmo host do app."

tags:
  - { name: governanca, description: "Grupos administrativos; requer grant cadastro." }
  - { name: identidade, description: "Marca pública e edição administrativa com grant modelos." }
  - { name: sessao, description: "Entrada, saída e quem está na sessão." }
  - { name: cadastro, description: "Unidade, tipos, locais, ativos e relações, pessoas e cargos, listas." }
  - { name: modelos, description: "Modelos de PT, versões, importação e exportação do pacote `ptw.modelo/1`." }
  - { name: pt, description: Permissões de trabalho e os atos sobre elas. }
  - { name: anexos, description: "Arquivos: conteúdo no S3 pela API, chave = SHA-256." }
  - { name: auditoria, description: "Trilha (`v_audit`), cadeia e exportação." }
  - { name: sistema, description: "Saúde, situação e avisos em tempo real." }

security:
  - sessao: []

x-ptw-error-map:
  description: "Classe de erro (SQLSTATE do banco ou código da API) → status HTTP."
  "422":
    - "PTW01–PTW09, PTW11, PTW15–PTW34 (recusa de regra; a mensagem é a do banco)"
    - "23514 (restrição de coluna)"
    - "PTA08 (Idempotency-Key reutilizada com outro corpo)"
    - "PTA09 (arquivo: SHA-256 ou tamanho não confere com o enviado)"
    - "PTA10 (prévia da importação vencida, ou pacote diferente do da prévia)"
  "409":
    - "PTW10 (equipamento ocupado; `detail` = id da PT que prende)"
    - "23505 (já existe um registro igual)"
    - "23503 (registro em uso ou inexistente)"
    - "PTA06 (revisão desatualizada; `detail` = revisão atual)"
  "428": ["PTA07 (falta If-Match)"]
  "400": ["PTA05 (requisição fora do contrato)", "22xxx e 23502 (dado inválido)"]
  "401": ["PTA02 (sem sessão, sessão expirada ou conta desativada)"]
  "403": ["PTA03 (a pessoa não tem a permissão da operação)", "42501 (o banco recusou o privilégio)"]
  "404": ["PTA04 (não existe nesta unidade)"]
  "413": ["PTA11 (arquivo maior que 2 GiB)"]
  "429": ["PTA12 (tentativas demais; fase 2)"]
  "500": ["PTW12 depois de repetir, PTW13, PTW14 (erro da API, nunca do usuário)", "PTA99 (erro não previsto)"]
  "501": ["PTA13 (ainda não disponível nesta fase)"]
  "503": ["PTA01 (banco ou armazenamento fora do ar; 08xxx, 53xxx, 57P0x)", "55P03 e 40001/40P01 depois de repetir (com Retry-After)"]
  "504": ["57014 (statement_timeout)"]

paths:
  /delegations:
    get:
      tags: [sessao]
      operationId: listDelegations
      summary: Delegações próprias ou todas, para administração de cadastro.
      responses:
        "200":
          description: Mandatos persistidos, inclusive revogados.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Delegation" } }
    post:
      tags: [governanca]
      operationId: createDelegation
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      x-ptw-audit: delegacao.criada, com pessoas/escopo/período e motivo.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DelegationInput" } } }
      responses:
        "201": { description: Delegação registrada., content: { application/json: { schema: { $ref: "#/components/schemas/Delegation" } } } }
  /delegations/{id}/revoke:
    post:
      tags: [governanca]
      operationId: revokeDelegation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      x-ptw-audit: delegacao.revogada; usos anteriores permanecem íntegros.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Delegação revogada., content: { application/json: { schema: { $ref: "#/components/schemas/Delegation" } } } }
  /person-groups:
    get:
      tags: [governanca]
      operationId: listPersonGroups
      summary: Grupos e seus membros da unidade; exige cadastro.
      responses:
        "200":
          description: Grupos persistidos.
          content:
            application/json:
              schema: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/PersonGroup" } }
    post:
      tags: [governanca]
      operationId: createPersonGroup
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      x-ptw-audit: cadastro.grupo.criado e membros incluídos, sem concessão de privilégios.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GroupInput" } } }
      responses:
        "201": { description: Grupo criado., content: { application/json: { schema: { $ref: "#/components/schemas/PersonGroup" } } } }
  /person-groups/{id}:
    put:
      tags: [governanca]
      operationId: updatePersonGroup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IfMatch" }
      x-ptw-audit: cadastro.grupo.alterado e diferenças dos membros, na mesma transação.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GroupInput" } } }
      responses:
        "200": { description: Grupo alterado., content: { application/json: { schema: { $ref: "#/components/schemas/PersonGroup" } } } }
  /appearance/public:
    get:
      tags: [sistema]
      operationId: getPublicAppearance
      security: []
      summary: Marca pública da unidade, sem identidade de pessoas ou dados administrativos.
      responses:
        "200": { description: Marca publicada ou fallback por arquivo., content: { application/json: { schema: { $ref: "#/components/schemas/PublicAppearance" } } } }
  /appearance:
    get:
      tags: [identidade]
      operationId: getAppearance
      summary: Configuração da identidade; exige grant modelos inclusive para leitura.
      responses:
        "200": { description: Revisão da configuração., content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [identidade]
      operationId: putAppearance
      summary: Publica identidade ou restaura fallback; exige grant modelos.
      x-ptw-audit: identidade.publicada/identidade.restaurada com autoria e revisão.
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PublicAppearance" } } }
      responses:
        "200": { description: Configuração confirmada., content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /appearance/assets:
    post:
      tags: [identidade]
      operationId: putAppearanceAsset
      summary: Imagem PNG limitada, por hash; só fica pública quando referenciada pela marca ativa.
      x-ptw-audit: identidade.imagem.incluida; hash e tamanho, sem conteúdo binário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base64]
              properties:
                base64: { type: string, minLength: 60, maxLength: 349528 }
      responses:
        "200":
          description: Nome seguro da imagem armazenada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [file]
                properties:
                  file: { type: string, pattern: '^[0-9a-f]{64}\.png$' }
  /appearance/assets/{file}:
    get:
      tags: [sistema]
      operationId: getAppearanceAsset
      security: []
      summary: Imagem da identidade atualmente publicada nesta unidade.
      parameters:
        - { name: file, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}\.png$' } }
      responses:
        "200": { description: PNG validado., content: { image/png: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  # ------------------------------------------------------------------ sessão
  /session:
    get:
      tags: [sessao]
      operationId: getSession
      parameters: [{ $ref: "#/components/parameters/RequestId" }, { $ref: "#/components/parameters/Client" }]
      summary: "Quem está na sessão (pessoa, unidade, permissões) e a hora do servidor."
      responses:
        "200": { description: Sessão ativa., content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /session/login:
    post:
      tags: [sessao]
      operationId: login
      summary: "Entrada com o login da empresa (LDAP/AD), quando configurado."
      security: []
      x-ptw-audit: "ptw.audit_log('sessao.entrada', ok ou falha)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password]
              properties:
                login: { type: string, pattern: "^[A-Za-z0-9._@-]{1,104}$" }
                password: { type: string, minLength: 1, maxLength: 1024, format: password }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Error" }
  /session/dev-login:
    post:
      tags: [sessao]
      operationId: devLogin
      summary: "Entrada de desenvolvimento, só com o login de uma pessoa do cadastro, sem senha."
      description: |
        Só existe com `PTW_DEV_LOGIN=1` no serviço `api` (nunca em implantação; `GET /status` mostra
        `devLogin`). Desligado, responde 404. Método de autenticação na trilha: `sessao`. Serve também para
        trocar de pessoa no desenvolvimento (a sessão anterior sai com `sessao.saida`).
      security: []
      x-ptw-audit: "ptw.audit_log('sessao.entrada'); se havia sessão, 'sessao.saida' antes"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login]
              properties:
                login: { type: string, maxLength: 104 }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /session/dev-people:
    get:
      tags: [sessao]
      operationId: listDevPeople
      summary: "Pessoas disponíveis para a entrada de demonstração, sem senha."
      description: "Somente com PTW_DEV_LOGIN=1; fora disso responde 404. Retorna só contas ativas da unidade."
      security: []
      responses:
        "200":
          description: Pessoas disponíveis.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, login]
                      properties:
                        id: { $ref: "#/components/schemas/Uuid" }
                        name: { type: string }
                        login: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /session/activity:
    post:
      tags: [sessao]
      operationId: sessionActivity
      summary: "Marca interação humana na sessão; polling não renova inatividade."
      responses:
        "204": { description: Atividade registrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /session/logout:
    post:
      tags: [sessao]
      operationId: logout
      summary: "Sai e apaga o cookie."
      x-ptw-audit: "ptw.audit_log('sessao.saida')"
      responses:
        "204": { description: Sessão encerrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------ cadastro
  /unit:
    get:
      tags: [cadastro]
      operationId: getUnit
      summary: "A unidade da sessão. Só leitura (a API não cria nem altera unidade)."
      responses:
        "200": { description: Unidade., content: { application/json: { schema: { $ref: "#/components/schemas/Unit" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "4XX": { $ref: "#/components/responses/Error" }

  /types:
    get:
      tags: [cadastro]
      operationId: listTypes
      summary: "Tipos configuráveis (`type_def`) das quatro famílias."
      parameters:
        - { name: family, in: query, schema: { $ref: "#/components/schemas/TypeFamily" } }
        - { name: active, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Q" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { description: "Página de tipos, por família e rótulo.", content: { application/json: { schema: { $ref: "#/components/schemas/TypePage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "4XX": { $ref: "#/components/responses/Error" }
    post:
      tags: [cadastro]
      operationId: createType
      summary: "Cria um tipo (também refaz um tipo removido, com o mesmo `id` e `X-Ptw-Undo`)."
      x-ptw-codes: ["23505", "23514"]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/Undo" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TypeInput" } } } }
      responses:
        "201": { description: Criado., content: { application/json: { schema: { $ref: "#/components/schemas/TypeDef" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Rule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "4XX": { $ref: "#/components/responses/Error" }
  /types/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [cadastro]
      operationId: getType
      summary: "Um tipo."
      responses:
        "200": { description: Tipo., content: { application/json: { schema: { $ref: "#/components/schemas/TypeDef" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [cadastro]
      operationId: updateType
      summary: "Renomeia, troca o ícone, desativa ou reativa. `type_def` não tem revisão (última escrita vale)."
      x-ptw-codes: ["23505", "23514", "23503"]
      parameters: [{ $ref: "#/components/parameters/Undo" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                label: { type: string, minLength: 1, maxLength: 80 }
                icon: { type: [string, "null"], pattern: "^[a-z0-9_]{1,40}$" }
                active: { type: boolean }
      responses:
        "200": { description: Alterado., content: { application/json: { schema: { $ref: "#/components/schemas/TypeDef" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Rule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "4XX": { $ref: "#/components/responses/Error" }
    delete:
      tags: [cadastro]
      operationId: removeType
      summary: "Remove um tipo sem uso. Em uso → 409 (`23503`); tipo do sistema (`systemKey`) → 422 (`23514`)."
      x-ptw-codes: ["23503", "23514"]
      parameters: [{ $ref: "#/components/parameters/Undo" }]
      responses:
        "204": { description: Removido. }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Rule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "4XX": { $ref: "#/components/responses/Error" }

  /locations:
    get:
      tags: [cadastro]
      operationId: listLocations
      summary: "Locais. A árvore inteira cabe em poucas páginas (`pageSize` até 1000)."
      parameters:
        - { $ref: "#/components/parameters/Q" }
        - { name: parentId, in: query, description: "Filhos diretos; `root` = locais sem pai.", schema: { type: string } }
        - { name: under, in: query, description: O local e tudo abaixo dele., schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: typeId, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { $ref: "#/components/parameters/Status" }
        - { $ref: "#/components/parameters/UpdatedSince" }
        - { name: sort, in: query, schema: { type: string, enum: [code, -code, name, -name, updatedAt, -updatedAt], default: code } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { description: Página de locais., content: { application/json: { schema: { $ref: "#/components/schemas/LocationPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "4XX": { $ref: "#/components/responses/Error" }
    post:
      tags: [cadastro]
      operationId: createLocation
      summary: "Cria um local."
      x-ptw-codes: [PTW02, "23505", "23503", "23514"]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/Undo" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocationInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/LocationOk" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Rule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "4XX": { $ref: "#/components/responses/Error" }
  /locations/asset-counts:
    get:
      tags: [cadastro]
      operationId: locationAssetCounts
      summary: Contagem distinta de ativos nos locais solicitados e seus descendentes.
      parameters:
        - name: locationIds
          in: query
          required: true
          style: form
          explode: true
          schema: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: "#/components/schemas/Uuid" } }
      responses:
        "200":
          description: Uma contagem por local, na ordem solicitada; inclui todas as situações de ativo.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [locationId, count]
                      properties:
                        locationId: { $ref: "#/components/schemas/Uuid" }
                        count: { type: integer, minimum: 0 }
        "404": { $ref: "#/components/responses/Error" }
        "4XX": { $ref: "#/components/responses/Error" }
  /locations/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [cadastro]
      operationId: getLocation
      summary: "Um local."
      responses:
        "200": { $ref: "#/components/responses/LocationOk" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cadastro]
      operationId: updateLocation
      summary: "Altera o local (mover = trocar `parentId`). Desativar = `status: inativo`."
      x-ptw-codes: [PTW02, "23505", "23503", "23514"]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/Undo" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocationInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/LocationOk" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Rule" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "4XX": { $ref: "#/components/responses/Error" }

  /assets:
    get:
      tags: [cadastro]
      operationId: listAssets
      summary: "Ativos, com busca por trecho do código, nome ou apelido (trigram, sem acento)."
      parameters:
        - { $ref: "#/components/parameters/Q" }
